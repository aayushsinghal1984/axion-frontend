apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
        - name: axion-ui
          image: axionacraayu.azurecr.io/axion-ui:latest
          ports:
            - containerPort: 80
